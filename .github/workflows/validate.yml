name: Validate VPN bootstrap and sing-box generator

on:
  pull_request:
  push:
    branches:
      - fix/selective-xray-routing-2026-11

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n vpn-bootstrap.sh
          bash -n bootstrap.sh
          bash -n amnezia-setup.sh
          bash -n bin/setup-xray-remote.sh
          bash -n bin/ensure-vpnadmin-remote.sh
          bash -n bin/root-ssh-policy-remote.sh
          bash -n bin/verify-xray-remote.sh
      - name: Offline bootstrap safety guards
        run: bash tests/smoke-bootstrap.sh
      - name: Check Python syntax
        run: python3 -m py_compile clients/generate_singbox.py
      - name: Run client generator tests
        run: python3 -m unittest discover -s clients/tests -v
